name: Build Firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        env: [flexi-2350_spi, flexi-2350_w5500, picobob-dlx]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: pio-${{ matrix.env }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}
        working-directory: firmware

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.env }}
          path: |
            firmware/.pio/build/${{ matrix.env }}/Flexi-Ninja*.uf2
            firmware/.pio/build/${{ matrix.env }}/Flexi-Ninja*.elf

  release:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir flat
          find artifacts -type f -name "Flexi-Ninja*" -exec cp {} flat/ \;

      - uses: ncipollo/release-action@v1
        with:
          tag: rolling
          name: Rolling Build
          body: |
            Automated rolling build from `${{ github.sha }}`
          artifacts: flat/*
          allowUpdates: true
          prerelease: true
          removeArtifacts: true
