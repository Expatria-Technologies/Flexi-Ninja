[platformio]
default_envs = flexi-2350_w5500

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = picosdk
board = flexi-2350

; Pre-build scripts (board-agnostic)
extra_scripts = pre:scripts/copy_board_header.py
    pre:generate_pio_headers.py
    post:scripts/rename_output.py

; Use custom Flexi-2350 board header
board_build.picosdk.board_header = flexi_hal_2350.h

; Upload via OpenOCD + CMSIS-DAP (Pi Debug Probe)
upload_protocol = cmsis-dap
debug_tool = cmsis-dap
debug_speed = 5000
debug_init_break = main

; Common build flags (matches CMake)
build_flags =
    -DPICO_BOARD="\"flexi_hal_2350\""
    -DPIO_STDIO_UART
    -DWIZCHIP_USE_CS=1
    -DBOARD_FLEXI_2350

; Include paths for headers (always include wiznet for compilation)
build_src_flags =
    -Iinclude
    -Ilib/modules/inc
    -Isrc
    -Ipio
    -Ilib/quadrature_encoder_substep
    -Ilib/wiznet/Ethernet
    -Ilib/wiznet/Ethernet/W5500
    -Ilib/wiznet/Internet/DHCP

; Environment: Flexi-2350 + W5500
[env:flexi-2350_w5500]
extra_scripts = pre:scripts/build_flexgpio.py
    pre:scripts/generate_flexgpio_ram.py
build_flags =
    ${env.build_flags}
    -D_WIZCHIP_=W5500

; Environment: Flexi-2350 + SPI mode (direct Raspberry Pi)
[env:flexi-2350_spi]
extra_scripts = pre:scripts/build_flexgpio.py
    pre:scripts/generate_flexgpio_ram.py
build_flags =
    ${env.build_flags}
    -DRASPBERRY_PI_SPI=1

; Exclude wiznet files for SPI mode (not used)
build_src_filter =
    +<*.c>
    -<w5*.c>
    -<wiz*.c>
    -<socket.c>
    -<dhcp.c>
