[platformio]
default_envs = flexi-2350_w5500

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = picosdk
board = flexi-2350

; Use pico2 SDK board header (RP2350)
board_build.picosdk.board_header = pico2.h

; Common build flags (matches CMake)
build_flags =
    -DPICO_BOARD="\"pico2\""
    -DPICO_DEFAULT_UART=1
    -DPICO_DEFAULT_UART_TX_PIN=4
    -DPICO_DEFAULT_UART_RX_PIN=5
    -DWIZCHIP_USE_CS=1

; Pre-build script to generate PIO headers
extra_scripts = pre:generate_pio_headers.py

; Include paths for headers (always include wiznet for compilation)
build_src_flags =
    -Iinclude
    -Ilib/modules/inc
    -Isrc
    -Ipio
    -Ilib/quadrature_encoder_substep
    -Ilib/wiznet/Ethernet
    -Ilib/wiznet/Ethernet/W5500
    -Ilib/wiznet/Ethernet/W5100S
    -Ilib/wiznet/Internet/DHCP

; Environment: Flexi-2350 + W5500
[env:flexi-2350_w5500]
build_flags =
    ${env.build_flags}
    -D_WIZCHIP_=W5500

; Environment: Flexi-2350 + W5100S
[env:flexi-2350_w5100s]
build_flags =
    ${env.build_flags}
    -D_WIZCHIP_=W5100S

; Environment: Flexi-2350 + SPI mode (direct Raspberry Pi)
[env:flexi-2350_spi]
build_flags =
    ${env.build_flags}
    -DRASPBERRY_PI_SPI_MODE=1
    -DRASPBERRY_PI_SPI=1

; Exclude wiznet files for SPI mode (not used)
build_src_filter =
    +<*.c>
    -<w5*.c>
    -<wiz*.c>
    -<socket.c>
    -<dhcp.c>
