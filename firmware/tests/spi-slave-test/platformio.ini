[platformio]
default_envs = flexi-2350_spi_test

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = picosdk

; Use the custom Flexi-2350 board header
board_build.picosdk.board_header = flexi_hal_2350.h

; Pre-build: copy the custom board header
extra_scripts = pre:../../scripts/copy_board_header.py

; Common build flags
build_flags =
    -DPICO_BOARD="\"flexi_hal_2350\""
    -DPIO_STDIO_UART
    -I../../include
    -I../../lib/modules/inc

[env:flexi-2350_spi_test]
board = flexi-2350
upload_protocol = cmsis-dap
debug_tool = cmsis-dap
debug_speed = 5000
